<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silhouette face demo</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font: 28px/1.35 -apple-system, system-ui, sans-serif; color: #f2f2f2; }
  /* An ellipse fitted to the face box that follows yaw, pitch, and roll. */
  #plane-wrap { position: absolute; transform: translate(-50%, -50%); perspective: 900px; }
  #plane { width: 100%; height: 100%; border: 3px solid rgba(255,255,255,.85); background: rgba(255,255,255,.14); border-radius: 50%; box-sizing: border-box; }
  .eye { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.25); transform: translate(-50%, -50%); }
  .eye.closed { height: 4px; border-radius: 4px; }
  /* Text mirrors itself when Silhouette's preview is mirrored, so it reads correctly there. */
  #card { position: absolute; left: 48px; top: 40px; transform-origin: center; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .silhouette-mirrored #card { transform: scaleX(-1); }
  #card h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: .1em; text-transform: uppercase; color: #e0e0e0; }
  #card table { border-collapse: collapse; }
  #card td { padding: 2px 24px 2px 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #card td:last-child { text-align: right; color: #fff; }
  #nodata { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #ddd; }
  .silhouette-mirrored #nodata { transform: translate(-50%, -50%) scaleX(-1); }
</style>
</head>
<body>
<div id="plane-wrap" style="left:50%;top:50%;width:0;height:0"><div id="plane"></div></div>
<div id="eyeL" class="eye" hidden></div>
<div id="eyeR" class="eye" hidden></div>
<div id="card">
  <h1>Head</h1>
  <table>
    <tr><td>Yaw</td><td id="yaw">–</td></tr>
    <tr><td>Pitch</td><td id="pitch">–</td></tr>
    <tr><td>Roll</td><td id="roll">–</td></tr>
    <tr><td>Centre</td><td id="center">–</td></tr>
    <tr><td>Size</td><td id="size">–</td></tr>
    <tr><td>Eyes open</td><td id="eyes">–</td></tr>
    <tr><td>Mouth</td><td id="mouth">–</td></tr>
    <tr><td>Distance</td><td id="dist">–</td></tr>
    <tr><td>Rate</td><td id="rate">–</td></tr>
  </table>
</div>
<div id="nodata">Waiting for a face…</div>
<script>
  const $ = id => document.getElementById(id);
  const fmt = (v, d = 0) => v == null ? '–' : v.toFixed(d);
  let times = [];
  function render(f) {
    const W = innerWidth, H = innerHeight;
    times.push(performance.now()); if (times.length > 20) times.shift();
    const rate = times.length > 1 ? 1000 * (times.length - 1) / (times.at(-1) - times[0]) : 0;
    $('rate').textContent = fmt(rate, 0) + ' Hz';
    $('nodata').hidden = f.detected;
    const wrap = $('plane-wrap');
    if (!f.detected) { wrap.style.width = wrap.style.height = '0px'; $('eyeL').hidden = $('eyeR').hidden = true; return; }
    // The ellipse fills the face box, padded a little so it rings the head.
    const cx = f.center.x * W, cy = f.center.y * H, w = f.box.w * W * 1.25, h = f.box.h * H * 1.45;
    wrap.style.left = cx + 'px'; wrap.style.top = cy + 'px'; wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
    $('plane').style.transform = `rotateY(${-(f.yaw || 0)}deg) rotateX(${f.pitch || 0}deg) rotateZ(${-(f.roll || 0)}deg)`;
    for (const [id, eye] of [['eyeL', f.leftEye], ['eyeR', f.rightEye]]) {
      const el = $(id); el.hidden = !eye; if (!eye) continue;
      el.style.left = eye.x * W + 'px'; el.style.top = eye.y * H + 'px';
      el.classList.toggle('closed', eye.open < 0.18);
    }
    $('yaw').textContent = fmt(f.yaw) + '°'; $('pitch').textContent = fmt(f.pitch) + '°'; $('roll').textContent = fmt(f.roll) + '°';
    $('center').textContent = `${fmt(f.center.x, 2)}, ${fmt(f.center.y, 2)}`;
    $('size').textContent = fmt(f.box.h * 100) + '% tall';
    $('eyes').textContent = `${fmt(f.leftEye?.open, 2)} / ${fmt(f.rightEye?.open, 2)}`;
    $('mouth').textContent = f.mouth ? fmt(f.mouth.open, 2) : '–';
    $('dist').textContent = f.distance != null ? fmt(f.distance, 2) + ' m' : '–';
  }
  // The app injects window.silhouette before this script runs.
  if (window.silhouette) { silhouette.on('face', render); if (silhouette.face) render(silhouette.face); }
  else $('nodata').textContent = 'Open this page inside Silhouette to see live data.';
</script>
</body>
</html>
